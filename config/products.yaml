settings:
  default_interval_seconds: 60
  cooldown_minutes: 10
  max_threads: 4
  status_port: 8080
  heartbeat_interval_seconds: 10
  job_timeout_seconds: 240
  worker_liveness_timeout_seconds: 30
  queue:
    url: "amqp://guest:guest@localhost:5672/"
    jobs_queue: "argus.jobs"
    results_queue: "argus.results"
    heartbeats_queue: "argus.heartbeats"
  rate_limits:
    bestbuy:
      min_interval_seconds: 15
      jitter_seconds: 5
    pokemoncenter:
      min_interval_seconds: 60
      jitter_seconds: 10
    cineplex:
      min_interval_seconds: 30
      jitter_seconds: 10

